<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Tin Tìm Trọ</title>
    <link rel="icon" type="image/png" href="./assets/logo.jpg" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary-color: #6e8efb;
        --secondary-color: #a777e3;
        --text-color: #333;
        --error-color: #ff4b4b;
        --success-color: #2ecc71;
        --border-color: #eee;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--secondary-color)
        );
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start; /* Căn trên cùng để cuộn trang nếu dài */
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 800px; /* Form này cần rộng hơn form đăng nhập */
        position: relative;
      }

      h2 {
        text-align: center;
        margin-bottom: 30px;
        color: var(--text-color);
        font-weight: 600;
      }

      /* Grid Layout cho form */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .full-width {
        grid-column: 1 / -1;
      }

      .input-group {
        margin-bottom: 15px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 500;
        font-size: 14px;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper i.icon {
        position: absolute;
        left: 15px;
        top: 15px; /* Điều chỉnh vị trí icon */
        color: #999;
        font-size: 16px;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 12px 15px 12px 45px; /* Chừa chỗ cho icon */
        border: 2px solid var(--border-color);
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        transition: all 0.3s ease;
        background: #fff;
      }

      textarea {
        height: 120px;
        resize: vertical;
        padding-left: 15px; /* Textarea thường không để icon bên trong */
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 4px rgba(110, 142, 251, 0.1);
      }

      /* Style riêng cho Upload ảnh */
      .image-upload-area {
        border: 2px dashed #ccc;
        border-radius: 10px;
        padding: 30px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        background: #f9f9f9;
        position: relative;
      }

      .image-upload-area:hover {
        border-color: var(--primary-color);
        background: #f0f4ff;
      }

      .image-upload-area i {
        font-size: 40px;
        color: #aaa;
        margin-bottom: 10px;
      }

      .image-upload-area p {
        color: #777;
        font-size: 13px;
      }

      #imageInput {
        display: none; /* Ẩn input file gốc */
      }

      /* Khu vực xem trước ảnh */
      .image-preview-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 15px;
      }

      .preview-item {
        width: 100px;
        height: 100px;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        border: 1px solid #ddd;
      }

      .preview-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .preview-item .remove-btn {
        position: absolute;
        top: 2px;
        right: 2px;
        background: rgba(255, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      button.submit-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(
          to right,
          var(--primary-color),
          var(--secondary-color)
        );
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-top: 20px;
      }

      button.submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(110, 142, 251, 0.4);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .form-grid {
          grid-template-columns: 1fr; /* Chuyển về 1 cột trên mobile */
        }
        body {
          padding: 20px 10px;
        }
      }

      /* Notification Styles */
      .message-box {
        margin-top: 15px;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        display: none;
      }
      .message-box.success {
        background: #e8f8f0;
        color: var(--success-color);
        display: block;
      }
      .message-box.error {
        background: #ffecec;
        color: var(--error-color);
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Đăng Tin Mới</h2>

      <form id="postForm">
        <!-- Upload Ảnh -->
        <div class="input-group full-width">
          <label>Hình ảnh minh họa (Tối đa 5 ảnh)</label>
          <div
            class="image-upload-area"
            onclick="document.getElementById('imageInput').click()"
          >
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Click để chọn ảnh hoặc kéo thả vào đây</p>
            <p style="font-size: 11px; color: #999">(JPG, PNG, JPEG)</p>
          </div>
          <input
            type="file"
            id="imageInput"
            accept="image/*"
            multiple
            onchange="handleImageSelect(event)"
          />

          <!-- Khu vực hiển thị ảnh đã chọn -->
          <div class="image-preview-container" id="imagePreview"></div>
        </div>

        <div class="form-grid">
          <!-- Tiêu đề tin -->
          <div class="input-group full-width">
            <label for="title">Tiêu đề tin (Giới thiệu chung)</label>
            <div class="input-wrapper">
              <i class="fas fa-heading icon"></i>
              <input
                type="text"
                id="title"
                placeholder="VD: Phòng trọ cao cấp gần đại học..."
                required
              />
            </div>
          </div>

          <!-- Giá cả -->
          <div class="input-group">
            <label for="price">Giá cho thuê (Triệu VNĐ/tháng)</label>
            <div class="input-wrapper">
              <i class="fas fa-tag icon"></i>
              <!-- Thêm step="any" để nhập số lẻ -->
              <input
                type="number"
                id="price"
                placeholder="VD: 3.5"
                required
                min="0"
                step="any"
              />
            </div>
            <!-- Checkbox Giá thương lượng -->
            <div style="margin-top: 10px; display: flex; align-items: center">
              <input
                type="checkbox"
                id="isNegotiable"
                style="width: 20px; margin-right: 10px; cursor: pointer"
                onchange="togglePrice()"
              />
              <label
                for="isNegotiable"
                style="
                  margin-bottom: 0;
                  cursor: pointer;
                  font-weight: normal;
                  font-size: 14px;
                "
                >Liên hệ để thương lượng giá</label
              >
            </div>
          </div>

          <!-- Diện tích -->
          <div class="input-group">
            <label for="area">Diện tích (m²)</label>
            <div class="input-wrapper">
              <i class="fas fa-ruler-combined icon"></i>
              <!-- Thêm step="any" để nhập số lẻ (VD: 25.5) -->
              <input
                type="number"
                id="area"
                placeholder="VD: 25.5"
                required
                min="0"
                step="any"
              />
            </div>
          </div>

          <!-- Địa điểm -->
          <div class="input-group full-width">
            <label for="address">Địa chỉ chi tiết</label>
            <div class="input-wrapper">
              <i class="fas fa-map-marker-alt icon"></i>
              <input
                type="text"
                id="address"
                placeholder="Số nhà, đường, phường, quận..."
                required
              />
            </div>
          </div>

          <!-- Số phòng ngủ -->
          <div class="input-group">
            <label for="bedroom">Số phòng ngủ</label>
            <div class="input-wrapper">
              <i class="fas fa-bed icon"></i>
              <input type="number" id="bedroom" value="1" min="0" />
            </div>
          </div>

          <!-- Số phòng tắm -->
          <div class="input-group">
            <label for="bathroom">Số phòng tắm (WC)</label>
            <div class="input-wrapper">
              <i class="fas fa-bath icon"></i>
              <input type="number" id="bathroom" value="1" min="0" />
            </div>
          </div>

          <!-- Mô tả chi tiết -->
          <div class="input-group full-width">
            <label for="description">Mô tả chi tiết</label>
            <textarea
              id="description"
              placeholder="Mô tả thêm về nội thất, giờ giấc, tiện ích xung quanh, thông tin liên hệ..."
            ></textarea>
          </div>
        </div>

        <button type="submit" class="submit-btn">Đăng Tin Ngay</button>
      </form>

      <div id="messageBox" class="message-box"></div>
    </div>

    <script>
      // Mảng lưu trữ các file ảnh đã chọn
      let selectedFiles = [];

      function handleImageSelect(event) {
        const files = Array.from(event.target.files);
        const previewContainer = document.getElementById("imagePreview");

        // Giới hạn tối đa 5 ảnh
        if (selectedFiles.length + files.length > 5) {
          alert("Bạn chỉ được chọn tối đa 5 ảnh!");
          return;
        }

        files.forEach((file) => {
          // Kiểm tra định dạng ảnh
          if (!file.type.startsWith("image/")) return;

          // Đưa file vào mảng quản lý
          selectedFiles.push(file);

          // Tạo FileReader để xem trước ảnh
          const reader = new FileReader();
          reader.onload = function (e) {
            const div = document.createElement("div");
            div.className = "preview-item";
            div.innerHTML = `
                        <img src="${e.target.result}" alt="Preview">
                        <button type="button" class="remove-btn" onclick="removeImage(this, '${file.name}')">×</button>
                    `;
            previewContainer.appendChild(div);
          };
          reader.readAsDataURL(file);
        });

        // Reset input để có thể chọn lại cùng 1 file nếu muốn
        event.target.value = "";
      }

      function removeImage(btn, fileName) {
        // Xóa khỏi giao diện
        btn.parentElement.remove();

        // Xóa khỏi mảng dữ liệu (logic đơn giản dựa trên tên)
        selectedFiles = selectedFiles.filter((f) => f.name !== fileName);
      }

      // TÍNH NĂNG MỚI: Bật/tắt nhập giá khi chọn thương lượng
      function togglePrice() {
        const checkbox = document.getElementById("isNegotiable");
        const priceInput = document.getElementById("price");

        if (checkbox.checked) {
          priceInput.value = ""; // Xóa giá trị cũ
          priceInput.disabled = true; // Khóa ô nhập
          priceInput.required = false; // Bỏ bắt buộc
          priceInput.placeholder = "Đang để chế độ thương lượng...";
          priceInput.style.backgroundColor = "#f5f5f5"; // Làm xám ô input
        } else {
          priceInput.disabled = false; // Mở khóa
          priceInput.required = true; // Bắt buộc nhập lại
          priceInput.placeholder = "VD: 3.5";
          priceInput.style.backgroundColor = "#fff";
        }
      }

      // Xử lý Submit Form
      document
        .getElementById("postForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const title = document.getElementById("title").value;
          const priceInput = document.getElementById("price");
          const areaInput = document.getElementById("area");
          const isNegotiable = document.getElementById("isNegotiable").checked;
          const location = document.getElementById("address").value;
          const bedrooms = parseInt(document.getElementById("bedroom").value);
          const bathrooms = parseInt(document.getElementById("bathroom").value);
          const description = document.getElementById("description").value;

          // Chuyển đổi sang số thực (float) để xử lý số thập phân
          const price = parseFloat(priceInput.value);
          const area = parseFloat(areaInput.value);
          const messageBox = document.getElementById("messageBox");

          // Reset thông báo
          messageBox.className = "message-box";
          messageBox.innerHTML = "";

          // Validate cơ bản
          if (selectedFiles.length === 0) {
            showMessage("Vui lòng chọn ít nhất 1 hình ảnh minh họa!", "error");
            return;
          }

          // Validate Diện tích
          if (isNaN(area) || area <= 0) {
            showMessage("Vui lòng nhập diện tích hợp lệ!", "error");
            return;
          }

          // Kiểm tra giá: Nếu KHÔNG phải thương lượng thì mới bắt buộc nhập giá
          if (!isNegotiable && (isNaN(price) || price < 0)) {
            showMessage("Vui lòng nhập giá tiền hợp lệ!", "error");
            return;
          }

          // Gọi API gửi dữ liệu đi
          try {
            const formData = new FormData();

            //Lấy file ảnh
            for (const image of selectedFiles) {
              formData.append("images", image);
            }

            //Lấy file text
            formData.append("title", title);
            formData.append("price", price);
            formData.append("isNegotiable", isNegotiable);
            formData.append("area", area);
            formData.append("location", location);
            formData.append("bedrooms", bedrooms);
            formData.append("bathrooms", bathrooms);
            formData.append("description", description);

            const response = await fetch(
              "https://timtro-backend.onrender.com/api/create-post",
              {
                method: "POST",
                body: formData,
              }
            );
            const data = await response.json();

            if (!response.ok) {
              showMessage(data.message, "error");
              return;
            }
          } catch (err) {
            showMessage("Có lỗi xảy ra, vui lòng thử lại sau", "error");
            return;
          }

          //Tạo thông báo thành công
          showMessage("Đăng bài thành công", "success");

          // Reset form sau khi đăng thành công
          setTimeout(() => {
            this.reset();
            // Reset trạng thái ô giá về mặc định
            document.getElementById("price").disabled = false;
            document.getElementById("price").style.backgroundColor = "#fff";

            document.getElementById("imagePreview").innerHTML = "";
            selectedFiles = [];
            messageBox.style.display = "none";
          }, 3000);
        });

      function showMessage(msg, type) {
        const box = document.getElementById("messageBox");
        box.textContent = msg;
        box.className = `message-box ${type}`;
      }
    </script>
  </body>
</html>
