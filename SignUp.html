<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký Tài Khoản</title>
    <link rel="icon" type="image/png" href="./assets/logo.jpg" />
    <!-- Font Awesome cho icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary-color: #6e8efb;
        --secondary-color: #a777e3;
        --text-color: #333;
        --error-color: #ff4b4b;
        --success-color: #2ecc71;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--secondary-color)
        );
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        position: relative;
        overflow: hidden;
      }

      /* Trang trí background */
      .container::before {
        content: "";
        position: absolute;
        top: -50px;
        right: -50px;
        width: 100px;
        height: 100px;
        background: var(--secondary-color);
        border-radius: 50%;
        opacity: 0.1;
      }

      h2 {
        text-align: center;
        margin-bottom: 30px;
        color: var(--text-color);
        font-weight: 600;
        font-size: 24px;
      }

      .input-group {
        margin-bottom: 20px;
        position: relative;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #666;
        font-size: 14px;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper i.icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
        font-size: 16px;
      }

      input {
        width: 100%;
        padding: 12px 45px 12px 45px; /* Padding trái phải để né icon */
        border: 2px solid #eee;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        transition: all 0.3s ease;
      }

      input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 4px rgba(110, 142, 251, 0.1);
      }

      /* Nút ẩn hiện password */
      .toggle-password {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #999;
        transition: color 0.3s;
      }

      .toggle-password:hover {
        color: var(--primary-color);
      }

      button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(
          to right,
          var(--primary-color),
          var(--secondary-color)
        );
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-top: 10px;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(110, 142, 251, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      /* Phần thông báo lỗi/thành công */
      .message-box {
        margin-top: 15px;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        display: none;
        text-align: center;
      }

      .message-box.error {
        display: block;
        background-color: #ffecec;
        color: var(--error-color);
        border: 1px solid #ffcaca;
      }

      .message-box.success {
        display: block;
        background-color: #e8f8f0;
        color: var(--success-color);
        border: 1px solid #c3e6d6;
      }

      .footer-text {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #666;
      }

      .footer-text a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
      }

      .footer-text a:hover {
        text-decoration: underline;
      }

      /* Hiệu ứng rung khi lỗi */
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      .shake {
        animation: shake 0.3s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div class="container" id="formContainer">
      <h2>Đăng Ký</h2>

      <form id="signupForm">
        <!-- Username -->
        <div class="input-group">
          <label for="username">Tên đăng nhập</label>
          <div class="input-wrapper">
            <i class="fas fa-user icon"></i>
            <input
              type="text"
              id="username"
              placeholder="Nhập tên đăng nhập..."
              required
            />
          </div>
        </div>

        <!-- Password -->
        <div class="input-group">
          <label for="password">Mật khẩu</label>
          <div class="input-wrapper">
            <i class="fas fa-lock icon"></i>
            <input
              type="password"
              id="password"
              placeholder="Nhập mật khẩu..."
              required
              minlength="6"
            />
            <i
              class="fas fa-eye toggle-password"
              onclick="togglePassword('password', this)"
            ></i>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="input-group">
          <label for="confirm_password">Nhập lại mật khẩu</label>
          <div class="input-wrapper">
            <i class="fas fa-lock icon"></i>
            <input
              type="password"
              id="confirm_password"
              placeholder="Xác nhận mật khẩu..."
              required
            />
            <i
              class="fas fa-eye toggle-password"
              onclick="togglePassword('confirm_password', this)"
            ></i>
          </div>
        </div>

        <button type="submit">Đăng Ký Ngay</button>
      </form>

      <!-- Khu vực hiển thị thông báo -->
      <div id="messageBox" class="message-box"></div>

      <div class="footer-text">
        Đã có tài khoản? <a href="Login.html">Đăng nhập</a>
      </div>
    </div>

    <script>
      // Hàm ẩn/hiện mật khẩu
      function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      // Xử lý sự kiện Submit form
      document
        .getElementById("signupForm")
        .addEventListener("submit", function (e) {
          e.preventDefault(); // Ngăn load lại trang

          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirm_password").value;
          const messageBox = document.getElementById("messageBox");
          const container = document.getElementById("formContainer");

          // Reset trạng thái thông báo
          messageBox.className = "message-box";
          messageBox.textContent = "";
          container.classList.remove("shake");

          // Validate cơ bản
          if (username.length < 3) {
            showError("Tên đăng nhập phải có ít nhất 3 ký tự!");
            return;
          }

          if (password.length < 6) {
            showError("Mật khẩu phải có ít nhất 6 ký tự!");
            return;
          }

          // Kiểm tra khớp mật khẩu
          if (password !== confirmPassword) {
            showError("Mật khẩu nhập lại không khớp!");
            return;
          }

          // Nếu thành công
          showSuccess(`Đăng ký thành công! Xin chào, ${username}.`);

          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);

          // Reset form (tuỳ chọn)
          // this.reset();
        });

      function showError(message) {
        const messageBox = document.getElementById("messageBox");
        const container = document.getElementById("formContainer");

        messageBox.textContent = message;
        messageBox.classList.add("error");

        // Thêm hiệu ứng rung
        container.classList.add("shake");
        setTimeout(() => {
          container.classList.remove("shake");
        }, 300);
      }

      function showSuccess(message) {
        const messageBox = document.getElementById("messageBox");
        messageBox.textContent = message;
        messageBox.classList.add("success");
      }
    </script>
  </body>
</html>
